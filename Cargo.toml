[workspace]
resolver = "3"
members = ["crates/fwg-core", "crates/fwg-app"]
# e2e/wlpointer is a standalone test helper with its own lockfile.
exclude = ["e2e"]

[workspace.package]
# Also the Android versionName (android/app/build.gradle.kts reads it from here).
version = "1.4.0"
edition = "2024"
license = "MIT"

[profile.release]
# Small, lean binaries for mobile.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
