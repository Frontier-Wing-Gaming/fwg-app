# Builds the Windows and Linux apps. Pushing a tag vX.Y.Z (matching the version in Cargo.toml)
# also publishes them as a GitHub release; running it by hand only builds them (download the files
# from the run's artifacts).
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          [ -n "$version" ] || { echo "::error::No version in [workspace.package] of Cargo.toml"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match the Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Static C runtime: fwg.exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop

      - name: Build
        run: cargo build --release --locked -p fwg-app --bin fwg

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target\release\fwg.exe stage\
          Copy-Item LICENSE stage\LICENSE.txt
          Compress-Archive -Path stage\* -DestinationPath "dist\FrontierGamingNetwork-$env:VERSION-windows-x64-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $path)) { choco install innosetup --no-progress -y | Out-Null }
            $iscc = $path
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\fwg.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop

      - name: Build
        run: |
          cargo build --release --locked -p fwg-app --bin fwg
          echo "Linked libraries:"; ldd target/release/fwg

      - name: .deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb -p fwg-app --no-build --no-strip -o dist/

      - name: .tar.gz
        run: |
          name="FrontierGamingNetwork-$VERSION-linux-x86_64"
          mkdir -p "stage/$name"
          cp target/release/fwg LICENSE packaging/linux/network.frontierwinggaming.app.desktop "stage/$name/"
          cp icon.png "stage/$name/network.frontierwinggaming.app.png"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - name: AppImage
        run: |
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA256  runtime" | sha256sum -c -
          chmod +x appimagetool

          app=AppDir
          install -Dm755 target/release/fwg "$app/usr/bin/fwg"
          install -Dm644 packaging/linux/network.frontierwinggaming.app.desktop "$app/usr/share/applications/network.frontierwinggaming.app.desktop"
          install -Dm644 icon.png "$app/usr/share/icons/hicolor/128x128/apps/network.frontierwinggaming.app.png"
          cp "$app/usr/share/applications/network.frontierwinggaming.app.desktop" "$app/"
          cp icon.png "$app/network.frontierwinggaming.app.png"
          ln -s usr/bin/fwg "$app/AppRun"

          # The runner has no FUSE, so appimagetool runs from its extracted copy.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream --runtime-file runtime \
            "$app" "dist/FrontierGamingNetwork-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          ## Downloads

          **Windows 10/11 (64-bit)**
          - `…-windows-x64-setup.exe`: installer (Start menu entry, uninstaller; no admin rights needed)
          - `…-windows-x64-portable.zip`: just `fwg.exe`, runs from any folder

          The app isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC".
          Click **More info → Run anyway**.

          **Linux (x86_64)**
          - `.AppImage`: runs on most distributions. Make it executable (`chmod +x`), then run it.
          - `.deb`: Debian, Ubuntu, Mint and others: `sudo apt install ./frontier-gaming-network_*.deb`
          - `.tar.gz`: the plain binary with its icon and `.desktop` file

          Desktop systems normally have everything the AppImage and `.tar.gz` need. If the app doesn't
          start on a minimal install, add `libxkbcommon-x11-0` (Debian/Ubuntu name).

          Check downloads against `SHA256SUMS.txt`.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Frontier Gaming Network $VERSION" --notes-file notes.md \
            --generate-notes $(ls | grep -v '^notes.md$')
